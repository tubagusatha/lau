<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>100 Reasons Why I Love You</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Caveat:wght@700&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --bg-color: #0b0914;
      --accent: #ff477e;
      --card-bg: rgba(22, 17, 36, 0.85);
    }
    
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background: var(--bg-color);
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      overflow-x: hidden;
      background-image: radial-gradient(circle at top right, rgba(255, 71, 126, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at bottom left, rgba(255, 71, 126, 0.1) 0%, transparent 40%);
    }

    /* Navbar/Controls */
    .controls {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    
    .controls > * {
      pointer-events: auto;
    }

    .btn {
      text-decoration: none;
      border-radius: 50px;
      padding: 12px 24px;
      color: #fff;
      font-weight: 700;
      background: rgba(255, 71, 126, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 71, 126, 0.5);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      font-family: "Montserrat", sans-serif;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    
    .btn:hover {
      background: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255, 71, 126, 0.5);
    }

    /* Header */
    .header-container {
      text-align: center;
      padding: 100px 20px 40px;
    }
    
    h1 {
      font-size: clamp(30px, 6vw, 60px);
      margin: 0;
      font-weight: 900;
      color: #ffb3c6;
      text-shadow: 0 0 15px rgba(255, 71, 126, 0.5);
    }
    
    p.subtitle {
      font-family: 'Caveat', cursive;
      font-size: clamp(20px, 4vw, 35px);
      color: #e0e0e0;
      margin-top: 10px;
      letter-spacing: 1px;
    }

    /* Grid Layout - Make it less rigid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 25px;
      padding: 0 5vw 100px;
      max-width: 1300px;
      margin: 0 auto;
    }
    
    /* 3D Flip Card */
    .scene {
      width: 100%;
      aspect-ratio: 3 / 4; /* Portrait like a real card/polaroid */
      perspective: 800px;
      cursor: pointer;
      /* The random rotation makes it look natural and scattered */
      transform: rotate(var(--rot, 0deg));
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), z-index 0s;
      z-index: 1;
    }

    .scene:hover {
      transform: rotate(0deg) scale(1.15) translateY(-5px);
      z-index: 10;
    }
    
    .scene.active-flip {
      z-index: 20;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
      transform-style: preserve-3d;
    }
    
    .card.is-flipped {
      transform: rotateY(180deg);
    }
    
    .card__face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 15px;
      box-sizing: border-box;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }
    
    /* Front of card (Number) */
    .card__face--front {
      background: var(--card-bg);
      border: 1px solid rgba(255, 71, 126, 0.4);
      backdrop-filter: blur(8px);
      font-size: clamp(30px, 5vw, 45px);
      font-family: 'Caveat', cursive; /* Hand-written style */
      font-weight: 700;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 71, 126, 0.8);
      background-image: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
    }
    
    .scene:hover .card__face--front {
      background: rgba(255, 71, 126, 0.15);
      border-color: rgba(255, 71, 126, 0.8);
    }

    /* Back of card (Reason) */
    .card__face--back {
      background: linear-gradient(135deg, #ff477e, #b5179e);
      transform: rotateY(180deg);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 25px rgba(255, 71, 126, 0.5), inset 0 0 15px rgba(0,0,0,0.2);
      font-family: 'Caveat', cursive; /* Makes it look like a hand-written note */
      font-size: clamp(16px, 1.8vw, 22px);
      font-weight: 700;
      line-height: 1.3;
      color: #fff;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .card__face--back::-webkit-scrollbar {
      display: none;
    }

    @media (max-width: 768px) {
      .btn {
        padding: 12px 20px;
        font-size: 11px;
      }
      .grid-container {
        grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
        gap: 15px;
        padding: 0 20px 80px;
      }
      .card__face--back {
        font-size: 14px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Audio -->
  <audio id="bgm" src="/img/you.mp3" preload="auto" loop></audio>

  <!-- Navbar -->
  <div class="controls">
    <button class="btn" id="toggleMusic">Play Music</button>
    <a href="../index.html" class="btn">Kembali</a>
  </div>

  <div class="header-container">
    <h1>100 Reasons</h1>
    <p class="subtitle">Kenapa aku sayang banget sama kamu...</p>
  </div>

  <!-- Grid of Cards -->
  <div class="grid-container" id="grid"></div>

  <!-- Script to generate 100 cards -->

        audio.play();

    // 100 Reasons Array

      "Karena masakan/perhatian kamu selalu bikin kangen.",
      "Karena pelukan virtualmu kerasa nyata di hati.",
      "Karena kita selalu punya cara buat baikan habis berantem.",
      "Karena kamu bikin aku ngerasa dihargai.",

      "Karena kamu ngajarin aku arti kesabaran.",
      "Karena kamu sering ngasih kejutan-kejutan kecil yang manis.",
      "Karena kamu orang yang paling aku percaya.",
      "Karena kamu nggak pernah bosan ngadepin kelakuanku.",
      "Karena kamu selalu berusaha bikin aku ketawa pas lagi sedih.",
      "Karena kamu pemaaf banget.",
      "Karena kamu kasih space buat aku tumbuh berkembang.",

      "Karena kamu sabar nungguin aku.",
      "Karena kamu ngertiin kesibukanku.",
      "Karena kamu sering ngirimin foto random keseharianmu.",
      "Karena kamu selalu excited tiap kali aku ngasih sesuatu.",

      "Karena jujur, cuma kamu yang bisa bikin aku tergila-gila gini.",

      "Karena kamu tau makanan kesukaanku.",
      "Karena kamu rajin ngingetin ibadah.",
      "Karena aku cinta semua tentang kamu.",
      "Karena kamu selalu berusaha luangin waktu di tengah kesibukan.",
      "Karena kamu adalah Cindy Laura, gadis paling manis sedunia.",
      "Pokoknya, karena kamu adalah KAMU! Aku sayang kamu selamanya! ❤️"
    ];

    const grid = document.getElementById('grid');

    reasons.forEach((reason, index) => {
      // Create scene
      const scene = document.createElement('div');
      scene.className = 'scene';
      
      // Add random rotation between -8deg and +8deg
      const rot = (Math.random() * 16 - 8).toFixed(2);
      scene.style.setProperty('--rot', `${rot}deg`);
      
      // Create card
      const card = document.createElement('div');
      card.className = 'card';
      
      // Toggle flip on click
      scene.addEventListener('click', () => {
        card.classList.toggle('is-flipped');
        scene.classList.toggle('active-flip');
      });

      // Front face
      const front = document.createElement('div');
      front.className = 'card__face card__face--front';
      front.textContent = index + 1;

      // Back face
      const back = document.createElement('div');
      back.className = 'card__face card__face--back';
      back.textContent = reason;

      card.appendChild(front);
      card.appendChild(back);
      scene.appendChild(card);
      grid.appendChild(scene);
    });

  </script>
</body>
</html>

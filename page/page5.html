<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Together</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --bg-color: #0b0914;
      --accent: #ff477e;
    }
    
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background: var(--bg-color);
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(circle at top right, rgba(255, 71, 126, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at bottom left, rgba(255, 71, 126, 0.1) 0%, transparent 50%);
    }

    /* Navbar/Controls */
    .controls {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    
    .controls > * {
      pointer-events: auto;
    }

    .btn {
      text-decoration: none;
      border-radius: 50px;
      padding: 12px 24px;
      color: #fff;
      font-weight: 700;
      background: rgba(255, 71, 126, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 71, 126, 0.4);
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    .btn:hover {
      background: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255, 71, 126, 0.4);
    }

    /* Minimalist Elegant Layout */
    .time-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 900px;
      padding: 40px 20px;
      z-index: 10;
    }

    .date-title {
      font-size: clamp(20px, 4vw, 30px);
      font-weight: 300;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #e0e0e0;
      margin-bottom: 20px;
    }

    .line {
      width: 60px;
      height: 2px;
      background: var(--accent);
      margin-bottom: 50px;
      box-shadow: 0 0 10px var(--accent);
    }

    .counter-display {
      display: flex;
      flex-direction: column;
      gap: 30px;
      width: 100%;
    }

    .counter-row {
      display: flex;
      justify-content: center;
      gap: clamp(20px, 6vw, 60px);
    }

    .c-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .c-item span {
      font-size: clamp(45px, 8vw, 80px);
      font-weight: 900;
      background: linear-gradient(135deg, #fff, #ffb3c6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
      min-width: 1.2em;
    }

    .c-item small {
      font-size: clamp(10px, 2vw, 14px);
      font-weight: 700;
      letter-spacing: 4px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 10px;
      text-transform: uppercase;
    }

    .bottom-text {
      margin-top: 60px;
      font-size: clamp(14px, 3vw, 18px);
      font-weight: 300;
      letter-spacing: 4px;
      color: #ffb3c6;
      font-style: italic;
    }

    @media (max-width: 768px) {
      .btn {
        padding: 10px 18px;
        font-size: 10px;
      }
      .counter-row {
        gap: 20px;
      }
      .line {
        margin-bottom: 40px;
      }
    }
  </style>
</head>
<body>

  <audio id="bgm" src="/img/you.mp3" preload="auto" loop></audio>

  <div class="controls">
    <button class="btn" id="toggleMusic">Play Music</button>
    <a href="../index.html" class="btn">Kembali</a>
  </div>

  <div class="time-container">
    <div class="date-title">28 Februari 2026</div>
    <div class="line"></div>
    
    <div class="counter-display">
      <div class="counter-row">
        <div class="c-item">
          <span id="years">0</span>
          <small>Tahun</small>
        </div>
        <div class="c-item">
          <span id="months">0</span>
          <small>Bulan</small>
        </div>
        <div class="c-item">
          <span id="days">0</span>
          <small>Hari</small>
        </div>
      </div>
      <div class="counter-row">
        <div class="c-item">
          <span id="hours">0</span>
          <small>Jam</small>
        </div>
        <div class="c-item">
          <span id="minutes">0</span>
          <small>Menit</small>
        </div>
        <div class="c-item">
          <span id="seconds">0</span>
          <small>Detik</small>
        </div>
      </div>
    </div>
    
    <div class="bottom-text">...and still counting</div>
  </div>

  <script>
    const audio = document.getElementById("bgm");
    const btnMusic = document.getElementById("toggleMusic");
    
    btnMusic.addEventListener("click", () => {
      if (audio.paused) {
        audio.play();
        btnMusic.textContent = "Pause Music";
      } else {
        audio.pause();
        btnMusic.textContent = "Play Music";
      }
    });

    const startDate = new Date("2026-02-28T00:00:00");

    function updateCounter() {
      const now = new Date();
      let diff = now - startDate;
      if (diff < 0) diff = 0;
      
      let years = now.getFullYear() - startDate.getFullYear();
      let months = now.getMonth() - startDate.getMonth();
      let days = now.getDate() - startDate.getDate();
      
      let hours = now.getHours() - startDate.getHours();
      let minutes = now.getMinutes() - startDate.getMinutes();
      let seconds = now.getSeconds() - startDate.getSeconds();

      if (seconds < 0) { seconds += 60; minutes--; }
      if (minutes < 0) { minutes += 60; hours--; }
      if (hours < 0) { hours += 24; days--; }
      if (days < 0) {
        const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
        days += prevMonth.getDate();
        months--;
      }
      if (months < 0) { months += 12; years--; }
      if (years < 0) { years = 0; months = 0; days = 0; hours = 0; minutes = 0; seconds = 0; }

      document.getElementById("years").textContent = years;
      document.getElementById("months").textContent = months;
      document.getElementById("days").textContent = days;
      document.getElementById("hours").textContent = hours;
      document.getElementById("minutes").textContent = minutes;
      document.getElementById("seconds").textContent = seconds;
    }

    setInterval(updateCounter, 1000);
    updateCounter(); 
  </script>
</body>
</html>
